<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MFG INC - Parts Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#101a2b; --muted:#5c6a7c; --line:#dce1ea; --line2:#c7cfdb;
  --navy:#0d1f38; --navy2:#16304f; --steel:#4a5c74; --accent:#a86b3c; --accent2:#c58a52;
  --chip:#e7edf4; --chip-ink:#274063; --good:#2f8f63;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:"Inter",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;}
::-webkit-scrollbar{width:9px;height:9px;}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;}

.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:400;}
.topin{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.mark{display:flex;align-items:center;gap:11px;}
.mark .m{width:40px;height:40px;border:1.5px solid var(--accent2);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.mark .m b{font-family:"Fraunces",serif;color:#fff;font-size:15px;line-height:1;}
.mark .m span{font-size:7px;letter-spacing:2px;color:var(--accent2);}
.mark .n{font-family:"Fraunces",serif;font-size:18px;font-weight:600;line-height:1.05;}
.mark .s{font-size:11px;color:#9fb1c8;max-width:32ch;line-height:1.3;}
.spacer{flex:1;}
.search{flex:1;min-width:180px;max-width:420px;}
.search input{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 13px;}
.selbrand{font-family:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 11px;}
.lang{display:flex;border:1px solid rgba(255,255,255,.25);border-radius:9px;overflow:hidden;}
.lang button{font-family:inherit;font-size:13px;font-weight:600;color:#c7d3e2;background:transparent;border:none;padding:9px 14px;cursor:pointer;}
.lang button.on{background:var(--accent);color:#1a1205;}
.tbtn{font-family:inherit;font-size:13px;font-weight:600;border-radius:9px;cursor:pointer;border:1px solid transparent;padding:10px 16px;}
.pdfb{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.28);}
.orderb{background:var(--accent);color:#1a1205;}

.chips{max-width:1180px;margin:0 auto;padding:16px 20px 4px;display:flex;gap:8px;flex-wrap:wrap;}
.chip{font-family:inherit;font-size:13px;font-weight:600;color:var(--chip-ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 15px;cursor:pointer;}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy);}

.wrap{max-width:1180px;margin:0 auto;padding:14px 20px 90px;}
.count{font-size:12.5px;color:var(--muted);margin:6px 2px 14px;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
.pimg{background:linear-gradient(160deg,#f4f7fb,#e7edf4);border-bottom:1px solid var(--line);height:112px;display:flex;align-items:center;justify-content:center;position:relative;}
.pimg svg{width:120px;height:84px;}
.pbadge{position:absolute;top:8px;right:8px;background:var(--navy);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:22px;height:22px;display:none;align-items:center;justify-content:center;padding:0 6px;}
.pbadge.on{display:flex;}
.pb{padding:14px 14px 15px;display:flex;flex-direction:column;flex:1;}
.pcat{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;}
.pnm{font-family:"Fraunces",serif;font-size:15.5px;font-weight:600;line-height:1.2;margin:5px 0 6px;}
.ppn{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
.ppn b{color:var(--ink);font-weight:600;}
.pbrand{font-size:12px;color:var(--steel);margin-top:2px;}
.pfoot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:12px;}
.price{font-family:"Fraunces",serif;font-size:18px;font-weight:600;color:var(--navy);}
.price small{font-family:"Inter";font-size:11px;color:var(--muted);font-weight:500;}
.addb{font-family:inherit;font-size:13px;font-weight:600;color:#fff;background:var(--navy);border:none;border-radius:9px;padding:9px 15px;cursor:pointer;}
.addb:hover{background:var(--navy2);}

.drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:90vw;background:var(--surface);border-left:1px solid var(--line);box-shadow:-24px 0 60px -30px rgba(13,31,56,.5);transform:translateX(100%);transition:transform .24s ease;z-index:600;display:flex;flex-direction:column;}
.drawer.on{transform:translateX(0);}
.dhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.dhead h3{font-size:19px;font-weight:600;}
.dclose{font-family:inherit;font-size:20px;color:var(--muted);background:none;border:none;cursor:pointer;line-height:1;}
.dbody{flex:1;overflow:auto;padding:16px 20px;}
.oi{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
.oi .oinfo{flex:1;min-width:0;}
.oi .onm{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.25;}
.oi .opn{font-size:11.5px;color:var(--muted);}
.stp{display:flex;align-items:center;gap:8px;}
.stp button{width:26px;height:26px;border:1px solid var(--line);background:#f4f6f9;border-radius:7px;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;line-height:1;}
.stp span{font-size:13px;font-weight:600;min-width:16px;text-align:center;}
.oline{font-size:13px;font-weight:600;color:var(--navy);min-width:56px;text-align:right;}
.empty{font-size:13.5px;color:var(--muted);padding:14px 0;}
.act{margin-top:20px;border-top:1px solid var(--line);padding-top:14px;}
.act h4{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
.act .a{font-size:12.5px;color:var(--ink);padding:5px 0;border-bottom:1px dashed var(--line);}
.act .a span{color:var(--accent);font-weight:600;}
.dfoot{border-top:1px solid var(--line);padding:16px 20px;}
.trow{display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin-bottom:12px;}
.dfoot .btn{width:100%;font-family:inherit;font-size:14px;font-weight:600;border-radius:9px;padding:13px;cursor:pointer;border:1px solid transparent;margin-top:8px;}
.b-copy{background:var(--navy);color:#fff;}
.b-call{background:var(--accent);color:#1a1205;display:block;text-align:center;text-decoration:none;}
.scrim{position:fixed;inset:0;background:rgba(9,17,30,.45);z-index:550;display:none;}
.scrim.on{display:block;}

@media (max-width:1080px){.grid{grid-template-columns:repeat(3,1fr);}}
@media (max-width:800px){
  .grid{grid-template-columns:repeat(2,1fr);}
  .mark .s{display:none;}
  .search{order:5;max-width:none;flex-basis:100%;}
}
@media (max-width:460px){.grid{grid-template-columns:1fr 1fr;}.pimg{height:96px;}.pimg svg{width:100px;height:72px;}}
.viewbar{max-width:1180px;margin:0 auto;padding:14px 20px 0;display:flex;gap:8px;}
.vbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 16px;cursor:pointer;}
.vbtn.on{background:var(--navy);color:#fff;border-color:var(--navy);}
#fleetView{display:none;}
.fleet{max-width:1180px;margin:0 auto;padding:14px 20px 96px;}
.flead{font-size:13px;color:var(--muted);line-height:1.55;margin:8px 2px 16px;max-width:62ch;}
.fclass{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;}
.fclass h3{font-size:19px;font-weight:600;margin-bottom:2px;}
.fc-sub{font-size:12px;color:var(--muted);margin-bottom:12px;}
.uchips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
.uchip{font-size:12px;color:var(--chip-ink);background:var(--chip);border-radius:999px;padding:5px 11px;}
.ftbl-wrap{overflow-x:auto;}
.ftbl{width:100%;border-collapse:collapse;}
.ftbl th{background:var(--navy);color:#fff;font-size:11px;font-weight:600;padding:9px 10px;text-align:left;white-space:nowrap;}
.ftbl th.r,.ftbl td.r{text-align:right;}
.ftbl td{font-size:12.5px;padding:9px 10px;border-top:1px solid var(--line);}
.ftbl tr:nth-child(even) td{background:#f6f8fb;}
.fpn{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);}
.fadd{font-family:inherit;font-size:11.5px;font-weight:600;color:#fff;background:var(--navy);border:none;border-radius:7px;padding:6px 11px;cursor:pointer;}
.fadd:hover{background:var(--navy2);}
.fnote{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5;}
.fspec{font-size:11.5px;color:var(--accent);margin-top:8px;font-weight:600;line-height:1.5;}
</style>
</head>
