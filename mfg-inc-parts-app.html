<title>MFG INC - Parts and Service Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e13;--bg2:#10141c;--card:#161c26;--card2:#1c2431;--line:#26303f;--line2:#334155;--red:#e01f26;--red2:#ff3a44;--amber:#f5a623;--green:#22c55e;--steel:#b8c0cc;--text:#e8edf4;--dim:#94a3b8;--muted:#64748b;--chip:#1c2431;--chip-ink:#c8d3e2;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:"Inter",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
h1,h2,h3,.serif{font-family:"Fraunces",Georgia,serif;}
::-webkit-scrollbar{width:9px;height:9px;}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;}
#login{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 700px at 50% -10%,#1a2230 0%,#0b0e13 60%);padding:20px;}
.lcard{width:100%;max-width:392px;background:linear-gradient(180deg,#141a24,#10141c);border:1px solid var(--line);border-radius:18px;padding:32px 26px 28px;box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center;}
.lmark{width:70px;height:70px;margin:0 auto 14px;border:2px solid var(--red2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.lmark b{font-family:"Fraunces",serif;font-size:22px;color:#fff;line-height:1;}
.lmark span{font-size:8px;letter-spacing:3px;color:var(--red2);margin-top:2px;}
.lt{font-family:"Fraunces",serif;font-size:20px;font-weight:600;}
.ls{color:var(--dim);font-size:12px;margin-top:5px;}
.pinrow{display:flex;gap:10px;justify-content:center;margin:22px 0 16px;}
.pdot{width:15px;height:15px;border-radius:50%;background:#0b0e13;border:2px solid var(--line2);transition:.15s;}
.pdot.on{background:var(--red2);border-color:var(--red2);box-shadow:0 0 12px rgba(255,58,68,.6);}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto;}
.pad button{font-family:inherit;font-size:20px;font-weight:600;color:var(--text);background:#0f1520;border:1px solid var(--line);border-radius:12px;padding:15px 0;cursor:pointer;}
.pad button:hover{border-color:var(--red2);}
.pad .ent{background:var(--red);color:#fff;border-color:var(--red);}
.lhint{font-size:11px;color:var(--muted);margin-top:14px;}
#app{display:none;grid-template-columns:230px 1fr;min-height:100vh;}
.side{background:var(--bg2);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;}
.sbrand{display:flex;align-items:center;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--line);}
.sbrand .m{width:40px;height:40px;border:1.5px solid var(--red2);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.sbrand .m b{font-family:"Fraunces",serif;color:#fff;font-size:14px;line-height:1;}
.sbrand .m span{font-size:7px;letter-spacing:2px;color:var(--red2);}
.sbrand .n{font-family:"Fraunces",serif;font-size:16px;color:#fff;font-weight:600;}
.sbrand .r{font-size:10px;color:var(--dim);margin-top:1px;}
.nav{margin-top:14px;display:flex;flex-direction:column;gap:2px;}
.nav a{color:var(--dim);text-decoration:none;font-size:14px;font-weight:500;padding:11px 12px;border-radius:9px;cursor:pointer;}
.nav a:hover{background:var(--card);color:var(--text);}
.nav a.on{background:var(--red);color:#fff;font-weight:600;}
.scontact{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);line-height:1.7;}
.scontact b{color:#fff;display:block;font-size:13px;}
.main{min-width:0;}
.top{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:200;}
.ham{display:none;background:var(--card);border:1px solid var(--line);border-radius:9px;color:#fff;font-size:18px;padding:6px 12px;cursor:pointer;}
.top .tt{font-family:"Fraunces",serif;font-size:18px;font-weight:600;flex:1;}
.lang{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
.lang button{font-family:inherit;font-size:13px;font-weight:600;color:var(--dim);background:transparent;border:none;padding:8px 13px;cursor:pointer;}
.lang button.on{background:var(--red);color:#fff;}
.obtn{font-family:inherit;font-size:13px;font-weight:600;color:#fff;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:9px 15px;cursor:pointer;}
.wrap{padding:24px 22px 90px;max-width:1180px;}
.view{display:none;}
.view.on{display:block;}
.h2{font-family:"Fraunces",serif;font-size:26px;font-weight:600;margin-bottom:6px;}
.lead{color:var(--dim);font-size:14px;line-height:1.55;margin-bottom:22px;max-width:64ch;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px;}
.kpi .k{font-family:"Fraunces",serif;font-size:24px;font-weight:600;color:#fff;}
.kpi .l{font-size:12px;color:var(--dim);margin-top:4px;}
.kpi .a{color:var(--amber);} .kpi .g{color:var(--green);} .kpi .rd{color:var(--red2);}
.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:18px;}
.panel h3{font-family:"Fraunces",serif;font-size:16px;font-weight:600;margin-bottom:12px;}
table{width:100%;border-collapse:collapse;}
th{background:var(--bg2);color:var(--steel);font-size:11px;font-weight:600;text-align:left;padding:10px 12px;white-space:nowrap;}
th.r,td.r{text-align:right;}
td{font-size:13px;padding:10px 12px;border-top:1px solid var(--line);color:var(--text);}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:13px;}
.badge{font-size:11px;font-weight:600;border-radius:999px;padding:3px 9px;}
.b-ok{background:rgba(34,197,94,.15);color:#4ade80;}
.b-warn{background:rgba(245,166,35,.15);color:#f5b942;}
.b-bad{background:rgba(224,31,38,.18);color:#ff6b70;}
.b-new{background:rgba(74,143,212,.18);color:#7ab6ee;}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip{font-family:inherit;font-size:13px;font-weight:600;color:var(--chip-ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 15px;cursor:pointer;}
.chip.on{background:var(--red);color:#fff;border-color:var(--red);}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.toolbar input,.toolbar select{font-family:inherit;font-size:13px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 12px;}
.toolbar input{flex:1;min-width:180px;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.pc{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;display:flex;flex-direction:column;}
.pimg{background:linear-gradient(160deg,#1b2330,#141b26);border-bottom:1px solid var(--line);height:104px;display:flex;align-items:center;justify-content:center;position:relative;}
.pimg svg{width:112px;height:78px;}
.pbadge{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:22px;height:22px;display:none;align-items:center;justify-content:center;padding:0 6px;}
.pbadge.on{display:flex;}
.pb{padding:13px;display:flex;flex-direction:column;flex:1;}
.pcat{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--red2);text-transform:uppercase;}
.pnm{font-family:"Fraunces",serif;font-size:15px;font-weight:600;margin:4px 0 5px;color:#fff;}
.ppn{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;}
.ppn b{color:var(--text);}
.pbrand{font-size:12px;color:var(--steel);margin-top:2px;}
.pfoot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:11px;}
.price{font-family:"Fraunces",serif;font-size:17px;font-weight:600;color:#fff;}
.price small{font-family:"Inter";font-size:11px;color:var(--dim);}
.addb{font-family:inherit;font-size:12.5px;font-weight:600;color:#fff;background:var(--red);border:none;border-radius:8px;padding:8px 14px;cursor:pointer;}
.fclass{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:16px;}
.fclass h3{font-family:"Fraunces",serif;font-size:18px;font-weight:600;margin-bottom:2px;color:#fff;}
.fc-sub{font-size:12px;color:var(--dim);margin-bottom:12px;}
.uchips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
.uchip{font-size:12px;color:var(--chip-ink);background:var(--chip);border-radius:999px;padding:5px 11px;}
.fspec{font-size:11.5px;color:var(--amber);margin-top:8px;font-weight:600;line-height:1.5;}
.fnote{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5;}
.clin{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:12px;}
.clin h4{font-family:"Fraunces",serif;font-size:16px;color:#fff;margin-bottom:5px;}
.clin p{font-size:13px;color:var(--dim);line-height:1.55;}
.contact-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:520px;}
.contact-card .role{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--red2);}
.contact-card .nm{font-family:"Fraunces",serif;font-size:24px;color:#fff;margin:6px 0 2px;}
.contact-card .ph{font-size:16px;color:#fff;font-weight:600;margin-top:12px;}
.contact-card .cp{font-size:13px;color:var(--dim);line-height:1.6;margin-top:12px;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:370px;max-width:90vw;background:var(--bg2);border-left:1px solid var(--line);box-shadow:-24px 0 60px -30px rgba(0,0,0,.7);transform:translateX(100%);transition:transform .24s ease;z-index:600;display:flex;flex-direction:column;}
.drawer.on{transform:translateX(0);}
.dhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.dhead h3{font-family:"Fraunces",serif;font-size:18px;color:#fff;}
.dclose{font-size:20px;color:var(--dim);background:none;border:none;cursor:pointer;}
.dbody{flex:1;overflow:auto;padding:16px 20px;}
.oi{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
.oi .oinfo{flex:1;min-width:0;}
.oi .onm{font-size:13px;font-weight:600;color:#fff;}
.oi .opn{font-size:11.5px;color:var(--dim);}
.stp{display:flex;align-items:center;gap:7px;}
.stp button{width:26px;height:26px;border:1px solid var(--line);background:var(--card);border-radius:7px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;}
.stp span{font-size:13px;font-weight:600;min-width:16px;text-align:center;}
.oline{font-size:13px;font-weight:600;color:#fff;min-width:54px;text-align:right;}
.empty{font-size:13px;color:var(--dim);padding:14px 0;}
.act{margin-top:18px;border-top:1px solid var(--line);padding-top:12px;}
.act h4{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
.act .a{font-size:12px;color:var(--text);padding:5px 0;border-bottom:1px dashed var(--line);}
.act .a span{color:var(--red2);font-weight:600;}
.dfoot{border-top:1px solid var(--line);padding:16px 20px;}
.trow{display:flex;justify-content:space-between;font-weight:700;font-size:15px;color:#fff;margin-bottom:12px;}
.dfoot .btn{width:100%;font-family:inherit;font-size:14px;font-weight:600;border-radius:9px;padding:13px;cursor:pointer;border:1px solid transparent;margin-top:8px;}
.b-copy{background:var(--card2);color:#fff;border:1px solid var(--line);}
.b-call{background:var(--red);color:#fff;display:block;text-align:center;text-decoration:none;}
.b-pdf{background:transparent;color:#fff;border:1px solid var(--line);}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:550;display:none;}
.scrim.on{display:block;}
@media (max-width:1080px){.grid{grid-template-columns:repeat(3,1fr);}.kpis{grid-template-columns:repeat(2,1fr);}}
@media (max-width:820px){
  #app{grid-template-columns:1fr;}
  .side{position:fixed;left:0;top:0;bottom:0;width:230px;transform:translateX(-100%);transition:transform .22s ease;z-index:800;}
  .side.open{transform:translateX(0);}
  .ham{display:inline-flex;}
  .grid{grid-template-columns:1fr 1fr;}
}
@media (max-width:460px){.grid{grid-template-columns:1fr 1fr;}.kpis{grid-template-columns:1fr 1fr;}.pimg{height:92px;}.pimg svg{width:96px;height:68px;}}
</style>
</head>

  function openPdf(){ if(!pdfB64){ return; } var bin = atob(pdfB64); var len = bin.length; var arr = new Uint8Array(len); for(var i=0;i<len;i++){ arr[i]=bin.charCodeAt(i); } var url = URL.createObjectURL(new Blob([arr],{type:"application/pdf"})); window.open(url,"_blank"); }
  document.getElementById("pdfb").addEventListener("click", openPdf);
  document.getElementById("pdfb2").addEventListener("click", openPdf);

  // gate
  var entry = "", dots = document.querySelectorAll(".pdot");
  function draw(){ dots.forEach(function(d,i){ if(i<entry.length){ d.classList.add("on"); } else { d.classList.remove("on"); } }); }
  document.querySelectorAll(".pad button").forEach(function(b){ b.addEventListener("click", function(){ var k = b.getAttribute("data-k"); if(k==="del"){ entry = entry.slice(0,-1); } else if(k==="ent"){ submit(); return; } else if(entry.length<4){ entry += k; } draw(); if(entry.length===4){ submit(); } }); });
  function submit(){ if(entry==="1005"){ document.getElementById("login").style.display="none"; document.getElementById("app").style.display="grid"; } else { entry=""; draw(); } }
